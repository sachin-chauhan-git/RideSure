server:
  port: 8080

spring:
  application:
    name: ridehail-backend

  # Database configuration: PostgreSQL with H2 fallback
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:ridehaildb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

# App-specific configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
  dispatch:
    search-radius-km: 10.0
    max-drivers-to-notify: 5
    acceptance-timeout-seconds: 20
